<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    LaTeX Course Favicon — Tx pixel-art design
    Color: single <g> attribute — change fill/stroke here to recolor all elements
    Grid: 32×32 viewBox, pixel size 1.5 for the x staircase
  -->
  <g fill="#0D47A1" stroke="#0D47A1">

    <!-- Border: thin dot-square frame -->
    <rect x="1" y="1" width="30" height="30" rx="4" ry="4"
          fill="none"
          stroke-width="1"
          stroke-dasharray="1.5 1.5"
          stroke-linecap="square"/>

    <!-- T: crossbar -->
    <rect x="4" y="5" width="14" height="2" stroke="none"/>

    <!-- T: stem (centered on crossbar: center x = 4 + 14/2 = 11) -->
    <rect x="10" y="5" width="2" height="12" stroke="none"/>

    <!-- x subscript: pixel-art staircase, 5×5 diagonal pattern -->
    <!-- pixel size = 1.5×1.5, step = 1.5 in both x and y              -->
    <!-- \ diagonal (top-left → bottom-right)                            -->
    <rect x="18.5" y="13"   width="1.5" height="1.5" stroke="none"/>
    <rect x="20"   y="14.5" width="1.5" height="1.5" stroke="none"/>
    <rect x="21.5" y="16"   width="1.5" height="1.5" stroke="none"/><!-- center -->
    <rect x="23"   y="17.5" width="1.5" height="1.5" stroke="none"/>
    <rect x="24.5" y="19"   width="1.5" height="1.5" stroke="none"/>
    <!-- / diagonal (top-right → bottom-left, center already drawn)      -->
    <rect x="24.5" y="13"   width="1.5" height="1.5" stroke="none"/>
    <rect x="23"   y="14.5" width="1.5" height="1.5" stroke="none"/>
    <rect x="20"   y="17.5" width="1.5" height="1.5" stroke="none"/>
    <rect x="18.5" y="19"   width="1.5" height="1.5" stroke="none"/>

    <!-- Underline 1 (longer) -->
    <rect x="4" y="22" width="20" height="1" stroke="none"/>

    <!-- Underline 2 (shorter) -->
    <rect x="6" y="24" width="14" height="1" stroke="none"/>

  </g>
</svg>
