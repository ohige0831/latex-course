    <rect x="1" y="1" width="30" height="30" rx="4" ry="4"
          fill="none"
          stroke-width="1"
          stroke-dasharray="1.5 1.5"
          stroke-linecap="square"/>
    <rect x="4" y="5" width="14" height="2" stroke="none"/>
    <rect x="10" y="5" width="2" height="12" stroke="none"/>
    <rect x="18.5" y="13"   width="1.5" height="1.5" stroke="none"/>
    <rect x="20"   y="14.5" width="1.5" height="1.5" stroke="none"/>
    <rect x="21.5" y="16"   width="1.5" height="1.5" stroke="none"/>
    <rect x="23"   y="17.5" width="1.5" height="1.5" stroke="none"/>
    <rect x="24.5" y="19"   width="1.5" height="1.5" stroke="none"/>
    <rect x="24.5" y="13"   width="1.5" height="1.5" stroke="none"/>
    <rect x="23"   y="14.5" width="1.5" height="1.5" stroke="none"/>
    <rect x="20"   y="17.5" width="1.5" height="1.5" stroke="none"/>
    <rect x="18.5" y="19"   width="1.5" height="1.5" stroke="none"/>
    <rect x="4" y="22" width="20" height="1" stroke="none"/>
    <rect x="6" y="24" width="14" height="1" stroke="none"/>
  </g>
  <!-- Wordmark -->
  <text x="58" y="28"
        fill="#0D47A1"
        font-family="'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif"
        font-size="22"
        font-weight="600"
        dominant-baseline="middle"
        stroke="none">LaTeX導入講座</text>
</svg>
