<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D47A1"/>

  <!-- Icon: 32×32 scaled to 180×180, centered horizontally (x-offset=510), y=90 -->
  <g fill="#FFFFFF" stroke="#FFFFFF" transform="translate(510,90) scale(5.625)">
    <rect x="1.5" y="1.5" width="29" height="29" rx="5" ry="5"
          fill="none"
          stroke-width="2"
          stroke-dasharray="2 2"
          stroke-linecap="square"/>
    <rect x="4"    y="6"  width="14"  height="2.5" stroke="none"/>
    <rect x="9.75" y="6"  width="2.5" height="13"  stroke="none"/>
    <line x1="19"  y1="12" x2="27"  y2="19"
          fill="none" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="27"  y1="12" x2="19"  y2="19"
          fill="none" stroke-width="2.5" stroke-linecap="square"/>
    <rect x="4"    y="22"  width="24" height="2"   stroke="none"/>
    <rect x="4"    y="25.5" width="24" height="2"  stroke="none"/>
  </g>

  <!-- Title -->
  <text x="600" y="360"
        fill="#FFFFFF"
        font-family="'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif"
        font-size="64"
        font-weight="700"
        text-anchor="middle"
        dominant-baseline="middle">LaTeX導入講座</text>

  <!-- Subtitle -->
  <text x="600" y="450"
        fill="#90B8F8"
        font-family="'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', system-ui, sans-serif"
        font-size="32"
        font-weight="400"
        text-anchor="middle"
        dominant-baseline="middle">Windowsで始めるLaTeX環境構築</text>
</svg>
